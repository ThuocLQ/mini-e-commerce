global:
  imageRegistry: ghcr.io/thuoclq
  imageTag: main
  pullPolicy: IfNotPresent
  storageClassName: local-path
  imagePullSecrets: []

defaultResources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

observability:
  enabled: true
  grafana:
    adminUser: admin
    adminPassword: admin
    storage: 2Gi
  prometheus:
    storage: 5Gi
  alerts:
    enabled: true
    kafkaConsumerLagThreshold: 100
    httpServerErrorRateThreshold: 5
    outboxFailedThreshold: 1
    projectionFailureThreshold: 1
  kafkaExporter:
    enabled: true

secrets:
  name: microshop-secrets

ingress:
  enabled: true
  className: traefik
  host: api.example.com
  storefrontHost: shop.example.com
  operationsHost: ops.example.com
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    enabled: true
    secretName: microshop-api-tls

apps:
  api-gateway:
    kind: web
    image:
      repository: microshop-api-gateway
    secretEnv:
      MICROSHOP_JWT_SECRET_KEY: jwt-secret-key
    env:
      ASPNETCORE_ENVIRONMENT: Kubernetes
      ASPNETCORE_HTTP_PORTS: "8080"
      ServiceDefaults__ExposeHealthEndpoints: "true"
      ServiceDefaults__ValidateProductionConfiguration: "true"
      ServiceDefaults__RequiredConfigurationKeys__0: Jwt:SecretKey
      Gateway__AllowedCorsOrigins__0: https://api.example.com
      Jwt__Issuer: MicroShop.IdentityService
      Jwt__Audience: MicroShop.Client
      Jwt__SecretKey: $(MICROSHOP_JWT_SECRET_KEY)
      ReverseProxy__Clusters__catalog-cluster__Destinations__catalog-destination__Address: http://catalogservice:8080/
      ReverseProxy__Clusters__basket-cluster__Destinations__basket-destination__Address: http://basketservice:8080/
      ReverseProxy__Clusters__ordering-cluster__Destinations__ordering-destination__Address: http://orderingservice:8080/
      ReverseProxy__Clusters__order-query-cluster__Destinations__order-query-destination__Address: http://orderqueryservice:8080/
      ReverseProxy__Clusters__discount-cluster__Destinations__discount-destination__Address: http://discountservice:8080/
      ReverseProxy__Clusters__identity-cluster__Destinations__identity-destination__Address: http://identityservice:8080/
      ReverseProxy__Clusters__payment-cluster__Destinations__payment-destination__Address: http://paymentservice:8080/
      ReverseProxy__Clusters__supplier-cluster__Destinations__supplier-destination__Address: http://supplierservice:8080/
      ReverseProxy__Routes__basket-route__AuthorizationPolicy: authenticated
      ReverseProxy__Routes__ordering-route__AuthorizationPolicy: authenticated
      ReverseProxy__Routes__payment-route__AuthorizationPolicy: authenticated
  catalogservice:
    kind: web
    image:
      repository: microshop-catalogservice
    secretEnv:
      MICROSHOP_POSTGRES_PASSWORD: postgres-password
      MICROSHOP_JWT_SECRET_KEY: jwt-secret-key
      MICROSHOP_INTERNAL_API_KEY: internal-api-key
      MICROSHOP_RABBITMQ_PASSWORD: rabbitmq-password
    env:
      ASPNETCORE_ENVIRONMENT: Kubernetes
      ASPNETCORE_HTTP_PORTS: "8080"
      ServiceDefaults__ExposeHealthEndpoints: "true"
      ServiceDefaults__ValidateProductionConfiguration: "true"
      ServiceDefaults__RequiredConfigurationKeys__0: ConnectionStrings:CatalogDb
      ServiceDefaults__RequiredConfigurationKeys__1: Jwt:SecretKey
      ServiceDefaults__RequiredConfigurationKeys__2: InternalApi:Key
      ServiceDefaults__RequiredConfigurationKeys__3: RabbitMq:Password
      ConnectionStrings__CatalogDb: Host=postgres;Port=5432;Database=catalogdb;Username=microshop;Password=$(MICROSHOP_POSTGRES_PASSWORD)
      Jwt__Issuer: MicroShop.IdentityService
      Jwt__Audience: MicroShop.Client
      Jwt__SecretKey: $(MICROSHOP_JWT_SECRET_KEY)
      InternalApi__Key: $(MICROSHOP_INTERNAL_API_KEY)
      RabbitMq__Host: rabbitmq
      RabbitMq__VirtualHost: /
      RabbitMq__UserName: microshop
      RabbitMq__Password: $(MICROSHOP_RABBITMQ_PASSWORD)
  inventoryservice:
    kind: web
    image:
      repository: microshop-inventoryservice
    secretEnv:
      MICROSHOP_POSTGRES_PASSWORD: postgres-password
      MICROSHOP_INTERNAL_API_KEY: internal-api-key
      MICROSHOP_RABBITMQ_PASSWORD: rabbitmq-password
    env:
      ASPNETCORE_ENVIRONMENT: Kubernetes
      ASPNETCORE_HTTP_PORTS: "8080"
      ServiceDefaults__ExposeHealthEndpoints: "true"
      ServiceDefaults__ValidateProductionConfiguration: "true"
      ServiceDefaults__RequiredConfigurationKeys__0: ConnectionStrings:InventoryDb
      ServiceDefaults__RequiredConfigurationKeys__1: InternalApi:Key
      ServiceDefaults__RequiredConfigurationKeys__2: RabbitMq:Password
      ConnectionStrings__InventoryDb: Host=postgres;Port=5432;Database=inventorydb;Username=microshop;Password=$(MICROSHOP_POSTGRES_PASSWORD)
      InternalApi__Key: $(MICROSHOP_INTERNAL_API_KEY)
      RabbitMq__Host: rabbitmq
      RabbitMq__VirtualHost: /
      RabbitMq__UserName: microshop
      RabbitMq__Password: $(MICROSHOP_RABBITMQ_PASSWORD)
  basketservice:
    kind: web
    image:
      repository: microshop-basketservice
    secretEnv:
      MICROSHOP_JWT_SECRET_KEY: jwt-secret-key
    env:
      ASPNETCORE_ENVIRONMENT: Kubernetes
      ASPNETCORE_HTTP_PORTS: "8080"
      ServiceDefaults__ExposeHealthEndpoints: "true"
      ServiceDefaults__ValidateProductionConfiguration: "true"
      ServiceDefaults__RequiredConfigurationKeys__0: ConnectionStrings:Redis
      ServiceDefaults__RequiredConfigurationKeys__1: Jwt:SecretKey
      ConnectionStrings__Redis: redis:6379
      Redis__ConnectionString: redis:6379
      ServiceUrls__CatalogHttp: http://catalogservice:8080
      ServiceUrls__CatalogGrpc: http://catalogservice:8080
      Jwt__Issuer: MicroShop.IdentityService
      Jwt__Audience: MicroShop.Client
      Jwt__SecretKey: $(MICROSHOP_JWT_SECRET_KEY)
  orderingservice:
    kind: web
    image:
      repository: microshop-orderingservice
    secretEnv:
      MICROSHOP_POSTGRES_PASSWORD: postgres-password
      MICROSHOP_RABBITMQ_PASSWORD: rabbitmq-password
      MICROSHOP_JWT_SECRET_KEY: jwt-secret-key
      MICROSHOP_INTERNAL_API_KEY: internal-api-key
    env:
      ASPNETCORE_ENVIRONMENT: Kubernetes
      ASPNETCORE_HTTP_PORTS: "8080"
      ServiceDefaults__ExposeHealthEndpoints: "true"
      KafkaOutbox__BootstrapServers: kafka:29092
      KafkaOutbox__Topic: microshop.order-events
      ServiceDefaults__ValidateProductionConfiguration: "true"
      ServiceDefaults__RequiredConfigurationKeys__0: ConnectionStrings:OrderingDb
      ServiceDefaults__RequiredConfigurationKeys__1: RabbitMq:Password
      ServiceDefaults__RequiredConfigurationKeys__2: Jwt:SecretKey
      ServiceDefaults__RequiredConfigurationKeys__3: InternalApi:Key
      ConnectionStrings__OrderingDb: Host=postgres;Port=5432;Database=orderingdb;Username=microshop;Password=$(MICROSHOP_POSTGRES_PASSWORD)
      ServiceUrls__BasketHttp: http://basketservice:8080
      ServiceUrls__CatalogHttp: http://catalogservice:8080
      ServiceUrls__DiscountHttp: http://discountservice:8080
      ServiceUrls__InventoryHttp: http://inventoryservice:8080
      RabbitMq__Host: rabbitmq
      RabbitMq__VirtualHost: /
      RabbitMq__UserName: microshop
      RabbitMq__Password: $(MICROSHOP_RABBITMQ_PASSWORD)
      Jwt__Issuer: MicroShop.IdentityService
      Jwt__Audience: MicroShop.Client
      Jwt__SecretKey: $(MICROSHOP_JWT_SECRET_KEY)
      InternalApi__Key: $(MICROSHOP_INTERNAL_API_KEY)
  discountservice:
    kind: web
    image:
      repository: microshop-discountservice
    secretEnv:
      MICROSHOP_POSTGRES_PASSWORD: postgres-password
    env:
      ASPNETCORE_ENVIRONMENT: Kubernetes
      ASPNETCORE_HTTP_PORTS: "8080"
      ServiceDefaults__ExposeHealthEndpoints: "true"
      ServiceDefaults__ValidateProductionConfiguration: "true"
      ServiceDefaults__RequiredConfigurationKeys__0: ConnectionStrings:DiscountDb
      ConnectionStrings__DiscountDb: Host=postgres;Port=5432;Database=discountdb;Username=microshop;Password=$(MICROSHOP_POSTGRES_PASSWORD)
  identityservice:
    kind: web
    image:
      repository: microshop-identityservice
    secretEnv:
      MICROSHOP_POSTGRES_PASSWORD: postgres-password
      MICROSHOP_JWT_SECRET_KEY: jwt-secret-key
      MICROSHOP_BOOTSTRAP_ADMIN_USERNAME: bootstrap-admin-username
      MICROSHOP_BOOTSTRAP_ADMIN_PASSWORD: bootstrap-admin-password
    env:
      ASPNETCORE_ENVIRONMENT: Kubernetes
      ASPNETCORE_HTTP_PORTS: "8080"
      ServiceDefaults__ExposeHealthEndpoints: "true"
      ServiceDefaults__ValidateProductionConfiguration: "true"
      ServiceDefaults__RequiredConfigurationKeys__0: ConnectionStrings:IdentityDb
      ServiceDefaults__RequiredConfigurationKeys__1: Jwt:SecretKey
      ConnectionStrings__IdentityDb: Host=postgres;Port=5432;Database=identitydb;Username=microshop;Password=$(MICROSHOP_POSTGRES_PASSWORD)
      Jwt__Issuer: MicroShop.IdentityService
      Jwt__Audience: MicroShop.Client
      Jwt__SecretKey: $(MICROSHOP_JWT_SECRET_KEY)
      Jwt__ExpirationMinutes: "120"
      BootstrapAdmin__Enabled: "true"
      BootstrapAdmin__UserName: $(MICROSHOP_BOOTSTRAP_ADMIN_USERNAME)
      BootstrapAdmin__Password: $(MICROSHOP_BOOTSTRAP_ADMIN_PASSWORD)
  paymentservice:
    kind: web
    image:
      repository: microshop-paymentservice
    secretEnv:
      MICROSHOP_POSTGRES_PASSWORD: postgres-password
      MICROSHOP_PAYMENT_WEBHOOK_SECRET: payment-webhook-secret
      MICROSHOP_JWT_SECRET_KEY: jwt-secret-key
      MICROSHOP_INTERNAL_API_KEY: internal-api-key
    env:
      ASPNETCORE_ENVIRONMENT: Kubernetes
      ASPNETCORE_HTTP_PORTS: "8080"
      ServiceDefaults__ExposeHealthEndpoints: "true"
      ServiceDefaults__ValidateProductionConfiguration: "true"
      ServiceDefaults__RequiredConfigurationKeys__0: ConnectionStrings:PaymentDb
      ServiceDefaults__RequiredConfigurationKeys__1: PaymentWebhooks:SharedSecret
      ServiceDefaults__RequiredConfigurationKeys__2: Jwt:SecretKey
      ServiceDefaults__RequiredConfigurationKeys__3: InternalApi:Key
      ConnectionStrings__PaymentDb: Host=postgres;Port=5432;Database=paymentdb;Username=microshop;Password=$(MICROSHOP_POSTGRES_PASSWORD)
      ServiceUrls__OrderingHttp: http://orderingservice:8080
      Jwt__Issuer: MicroShop.IdentityService
      Jwt__Audience: MicroShop.Client
      Jwt__SecretKey: $(MICROSHOP_JWT_SECRET_KEY)
      InternalApi__Key: $(MICROSHOP_INTERNAL_API_KEY)
      PaymentWebhooks__SignatureHeaderName: X-MicroShop-Signature
      PaymentWebhooks__SharedSecret: $(MICROSHOP_PAYMENT_WEBHOOK_SECRET)
      PaymentWebhooks__RequireSignature: "true"
  orderqueryservice:
    kind: web
    image:
      repository: microshop-orderqueryservice
    secretEnv:
      MICROSHOP_MONGO_PASSWORD: mongo-password
      MICROSHOP_JWT_SECRET_KEY: jwt-secret-key
    env:
      ASPNETCORE_ENVIRONMENT: Kubernetes
      ASPNETCORE_HTTP_PORTS: "8080"
      ServiceDefaults__ExposeHealthEndpoints: "true"
      ServiceDefaults__ValidateProductionConfiguration: "true"
      ServiceDefaults__RequiredConfigurationKeys__0: MongoDb:ConnectionString
      ServiceDefaults__RequiredConfigurationKeys__1: Jwt:SecretKey
      MongoDb__ConnectionString: mongodb://microshop:$(MICROSHOP_MONGO_PASSWORD)@mongodb:27017/?authSource=admin
      MongoDb__DatabaseName: MicroShop_OrderReadDb
      MongoDb__OrderSummariesCollectionName: order_summaries
      Jwt__Issuer: MicroShop.IdentityService
      Jwt__Audience: MicroShop.Client
      Jwt__SecretKey: $(MICROSHOP_JWT_SECRET_KEY)
  projectionworker:
    kind: worker
    image:
      repository: microshop-projectionworker
    secretEnv:
      MICROSHOP_MONGO_PASSWORD: mongo-password
    env:
      DOTNET_ENVIRONMENT: Kubernetes
      ServiceDefaults__ValidateProductionConfiguration: "true"
      ServiceDefaults__RequiredConfigurationKeys__0: Kafka:BootstrapServers
      ServiceDefaults__RequiredConfigurationKeys__1: MongoDb:ConnectionString
      Kafka__BootstrapServers: kafka:29092
      Kafka__Topic: microshop.order-events
      Kafka__RetryTopic: microshop.order-events.retry
      Kafka__DeadLetterTopic: microshop.order-events.dlt
      Kafka__GroupId: projection-worker
      Kafka__MaxRetryAttempts: "3"
      Kafka__InitialRetryDelaySeconds: "5"
      Kafka__MaxRetryDelaySeconds: "60"
      MongoDb__ConnectionString: mongodb://microshop:$(MICROSHOP_MONGO_PASSWORD)@mongodb:27017/?authSource=admin
      MongoDb__DatabaseName: MicroShop_OrderReadDb
      MongoDb__OrderSummariesCollectionName: order_summaries
      MongoDb__ProjectionFailuresCollectionName: projection_failures
      MongoDb__ProcessedEventsCollectionName: processed_projection_events
  notificationworker:
    kind: worker
    image:
      repository: microshop-notificationworker
    secretEnv:
      MICROSHOP_RABBITMQ_PASSWORD: rabbitmq-password
    env:
      DOTNET_ENVIRONMENT: Kubernetes
      ServiceDefaults__ValidateProductionConfiguration: "true"
      ServiceDefaults__RequiredConfigurationKeys__0: RabbitMq:Password
      RabbitMq__Host: rabbitmq
      RabbitMq__VirtualHost: /
      ConnectionStrings__Redis: redis:6379
      RabbitMq__UserName: microshop
      RabbitMq__Password: $(MICROSHOP_RABBITMQ_PASSWORD)

  supplierservice:
    kind: web
    port: 8080
    readinessPath: /actuator/health
    livenessPath: /actuator/health
    image:
      repository: microshop-supplierservice
    secretEnv:
      MICROSHOP_POSTGRES_PASSWORD: postgres-password
      MICROSHOP_JWT_SECRET_KEY: jwt-secret-key
      MICROSHOP_INTERNAL_API_KEY: internal-api-key
    env:
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/supplierdb
      SUPPLIER_DB_USERNAME: microshop
      SUPPLIER_DB_PASSWORD: $(MICROSHOP_POSTGRES_PASSWORD)
      MICROSHOP_JWT_ISSUER: MicroShop.IdentityService
      MICROSHOP_JWT_AUDIENCE: MicroShop.Client
      INVENTORY_BASE_URL: http://inventoryservice:8080
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus
  storefront:
    kind: web
    port: 3000
    readinessPath: /
    livenessPath: /
    image:
      repository: microshop-storefront
    env:
      MICROSHOP_GATEWAY_BASE_URL: http://api-gateway:8080
      MICROSHOP_PUBLIC_ORIGIN: https://shop.example.com
      MICROSHOP_COOKIE_SECURE: "true"
  operations:
    kind: web
    port: 3000
    readinessPath: /
    livenessPath: /
    image:
      repository: microshop-operations
    env:
      MICROSHOP_GATEWAY_BASE_URL: http://api-gateway:8080
      MICROSHOP_PUBLIC_ORIGIN: https://ops.example.com
      MICROSHOP_COOKIE_SECURE: "true"

infra:
  postgres:
    storage: 10Gi
  redis:
    storage: 2Gi
  rabbitmq:
    storage: 5Gi
  mongodb:
    storage: 10Gi
  zookeeper:
    storage: 2Gi
  kafka:
    storage: 10Gi
