global:
  resolve_timeout: 5m

route:
  receiver: microshop-operations
  group_by: [alertname, service, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: microshop-operations
    email_configs:
      - to: operations@microshop.test
        from: alerts@microshop.test
        smarthost: mailpit:1025
        require_tls: false
        send_resolved: true